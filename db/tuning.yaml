# ============================================================================
# tuning.yaml — 조정 가능한 수치의 단일 출처
#
# **코드가 이 파일을 읽는다.** 리터럴로 박지 않는다.
# 값을 바꾸려면 여기만 고친다. 근거와 이력은 TUNING.md 에 있다.
#
# 여기 없는 것: 스키마 제약(schema.sql), 소스별 폴링 주기(sources 행이 정본),
#              프롬프트 문구(각 단계 프롬프트 문서)
# ============================================================================

window:
  # 크론은 KST 로 쓴다. n8n 워크플로 타임존을 cron_timezone 과 맞춘다.
  # 저장되는 시각(as_of·published_at)은 여전히 UTC 다 — 크론은 사람이
  # 관리하는 스케줄이고 데이터의 시각과는 성격이 다르다.
  # KST 04:00 을 UTC 로 쓰면 "일요일 19:00" 이 되어 요일이 밀린다
  cron_timezone: "Asia/Seoul"
  collect_cron: "0 2 * * *"        # 매일 02:00 KST — 수집·본문·분류·분석
  batch_cron:   "0 4 * * MON"      # 월요일 04:00 KST — 클러스터·소재
  # 이슈 탐지 창(일). window_from = as_of - issue_days, window_to = as_of
  issue_days: 7
  # 소재 stale 전이(일). created_at 기준, state='new' 인 것만
  topic_stale_days: 21
  # 열도의 "최근" 판정(시간). as_of 기준
  recent_hours: 72

polling:
  # 신규 소스 등록 시 넣을 기본값. DDL 에는 DEFAULT 를 두지 않는다 —
  # 두면 이 파일만 고쳤을 때 둘이 갈린다
  default_interval_min: 720
  # 연속 신규 0건이 이 횟수를 넘으면 알림
  empty_streak_alert: 20

classification:
  # 3단계 분류 입력 상한. body 앞부분을 쓰고 body 가 없으면 snippet 으로 대체.
  # snippet 만 쓰면 소스별 정보량이 106자~1,898자로 18배 차이 난다(실측) —
  # 환경미디어는 description 에 전문이 오고, ESG Today 는 description 이
  # 대부분 <img> 태그라 벗기면 106자만 남는다.
  # 600 은 임팩트온(300)·Carbon Brief(240) 요약 길이 위, 전문보다 충분히 짧다
  input_max_chars: 600

gate:
  # 3단계 게이트. AI 호출 **전에** 제목으로 다이제스트를 거른다 —
  # collector 로 보내봤자 이미 콜을 쓴 뒤다.
  #
  # 【】 전체를 거르면 안 된다. 실측 10건 중 3건(【기획】KSSB 전수 분석,
  # 【칼럼】넷제로 전략)은 단일 주제라 오히려 좋은 소재 재료다.
  # excluded 는 다운스트림 전체에서 사라지므로 30% 오제외는 감수할 수 없다.
  #
  # 모르는 태그는 **통과**시키고 경고만 남긴다. 잘못 거르면 기사가 통째로
  # 사라지지만, 잘못 통과시키면 분류가 이상해질 뿐이다 — state_tags 의
  # "모르면 좁게 처리한다"와 같은 방향.
  # 다만 통과한 다이제스트가 반드시 mapping_failed 가 되는 건 아니다.
  # 담긴 여러 건 중 하나를 골라 정상 subject 로 분류될 수 있어서,
  # 경고 건수를 요약에 남겨 다음 튜닝 근거로 쓴다.
  digest_tags:
    - "데일리 ESG 정책 브리핑"
    - "ESG Deal"
    - "위클리 ESG 행사"
    - "핫클립"

validation:
  # 4단계 검증기. 길이는 공백 포함, 양끝만 trim 후 센다
  issue_signal_max_chars: 30       # 초과 → NULL. repair 안 함
  summary_warn_chars: 400          # 경고만. 데이터는 안 건드림
  classify_reason_max_chars: 20    # 프롬프트 지시. 강제 안 함
  analysis_max_attempts: 3

scoring:
  # 현재 공식. 열도 가산 없음 — 어떤 신호를 얼마로 섞을지 근거가 아직 없다
  final_score_formula: "business_relevance"
  hot_weights: null                # 미정
  # 7단계 선별. null 이면 미적용 = 전 이슈를 소재화한다 (캘리브레이션 모드)
  select_threshold: null
  topics_per_batch_max: null

prompt_versions:
  classify: 4        # 3단계. 버전을 저장하지 않고 최신으로 덮어쓴다
  analyze: 1         # 4단계. article_analysis.prompt_version 에 저장된다
  cluster: 3         # 5단계
  compose: 1         # 6단계

# topics.state_tags 어휘. 코드는 영문 스네이크, 표시 이름은 화면이 붙인다.
# articles_action: 이 태그로 거절했을 때 근거 기사를 어떻게 할 것인가
topic_reject_tags:
  too_broad:        { label: "너무 넓음",            articles_action: keep }
  no_evidence:      { label: "근거 댈 게 없는 주제",  articles_action: keep }
  service_mismatch: { label: "서비스랑 안 맞음",      articles_action: exclude }
  already_covered:  { label: "이미 다룬 내용",        articles_action: exclude }
  low_heat:         { label: "화제성 낮음",           articles_action: keep }

# requeue(소비된 기사를 후보로 되돌리기)는 MVP 에 없다.
# 되돌려도 다음 배치엔 이미 창 밖이라 stale 로 죽는다 — 창 우회 상태를 하나 더
# 만들어 때우는 대신, 재분할 경로를 설계할 때 같이 만든다. TUNING.md 참조.
